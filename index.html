<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turnverein Ersingen Kasse</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        body {
            margin: 0;
            padding: 16px;
            background: #f5f5f5;
            max-width: 600px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            color: #2c5530;
            margin-bottom: 20px;
        }
        
        .category {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .category h2 {
            margin: 0 0 12px 0;
            color: #333;
            font-size: 1.1em;
            border-bottom: 2px solid #2c5530;
            padding-bottom: 8px;
        }
        
        .items {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 8px;
        }
        
        .item-btn {
            background: #e8f5e9;
            border: 2px solid #2c5530;
            border-radius: 8px;
            padding: 12px 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .item-btn:hover {
            background: #2c5530;
            color: white;
        }
        
        .item-btn:active {
            transform: scale(0.95);
        }
        
        .item-name {
            font-weight: bold;
            display: block;
        }
        
        .item-price {
            color: #666;
            font-size: 12px;
        }
        
        .item-btn:hover .item-price {
            color: #ccc;
        }
        
        #warenkorb {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            position: sticky;
            top: 16px;
        }
        
        #warenkorb h2 {
            margin: 0 0 0px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        #liste {
            max-height: 140px;
            overflow-y: auto;
            margin-bottom: 0px;
        }
        
		.warenkorb-item {
			display: grid;
			grid-template-columns: 45px 1fr auto;
			gap: 10px;
			align-items: center;
			padding: 10px 0;
			border-bottom: 1px solid #eee;
		}
        
        .warenkorb-item:last-child {
            border-bottom: none;
        }
        
		.warenkorb-menge {
			display: flex;
			justify-content: center;
			align-items: center;
		}
		
		.warenkorb-name {
			line-height: 1.3;
			word-break: break-word;
		}
		
		.warenkorb-rechts {
			display: flex;
			align-items: center;
			gap: 8px;
			white-space: nowrap;
		}
		
		.remove-btn {
			background: #ff5252;
			color: white;
			border: none;
			border-radius: 6px;
			width: 30px;
			height: 30px;
			cursor: pointer;
			font-size: 20px;
			font-weight: bold;
		}
        
        .summe {
            font-size: 1.2em;
            font-weight: bold;
            text-align: right;
            color: #2c5530;
            padding-top: 12px;
            border-top: 2px solid #2c5530;
        }
        
        .actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        
        .action-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        
        .clear-btn {
            background: #ff5252;
            color: white;
        }
        
        .pay-btn {
            background: #2c5530;
            color: white;
        }
        
        .empty-msg {
            color: #999;
            text-align: center;
            padding: 0px;
        }
        
		.menge {
			background: #2c5530;
			color: white;
			border-radius: 4px;
			padding: 4px 8px;
			font-size: 12px;
			margin: 0;
			white-space: nowrap;
        }
    </style>
</head>
<body>
    <h1>🏋️ Turnverein Ersingen Kasse</h1>
    
    <div id="warenkorb">
        <h2>
            <span>🛒 Warenkorb</span>
        </h2>
        <div id="liste">
            <p class="empty-msg">Noch keine Artikel ausgewählt</p>
        </div>
        <div class="summe">Summe: <span id="summe">0,00 €</span></div>
        <div class="actions">
            <button class="action-btn clear-btn" onclick="leeren()">Leeren</button>
            <button class="action-btn pay-btn" onclick="bezahlen()">Bezahlt ✓</button>
        </div>
    </div>
    
    <div class="category">
        <h2>🥤 Getränke</h2>
        <div class="items" id="getraenke"></div>
    </div>
    
    <div class="category">
        <h2>🍺 Bier & Wein</h2>
        <div class="items" id="alkohol"></div>
    </div>
    
    <div class="category">
        <h2>🍕 Speisen</h2>
        <div class="items" id="speisen"></div>
    </div>
    
    <div class="category">
        <h2>🍫 sonstiges</h2>
        <div class="items" id="sonstiges"></div>
    </div>

    <script>
        // ============================================
        // PREISE HIER ANPASSEN:
        // ============================================
        const produkte = {
            getraenke: [
                { name: "Sprudel sauer (spritzig/still) 0,5l", preis: 1.50 },
                { name: "Spezi/Iso/Sprudel süß 0,5l", preis: 2.00 },
                { name: "Cola/Fanta 0,33l", preis: 2.00 },
                { name: "Saftschorle (Apfel/Johannisb.) 0,5l", preis: 2.00 },
            ],
            alkohol: [
                { name: "Bier (Helles) 0,5l", preis: 3.00 },
                { name: "Weizenbier 0,5l", preis: 3.00 },
				{ name: "Bier alkoholfrei 0,5l", preis: 3.00 },
                { name: "Pils 0,33l", preis: 2.50 },
                { name: "Weinschorle 0,25l", preis: 3.00 },
                { name: "Weinschorle im Dubbeglas 0,5l ", preis: 5.00 },
                { name: "Qualitätswein 0,25l ", preis: 3.50 },
                { name: "Aperol 0,25l ", preis: 5.00 },
                { name: "Flasche Sekt 0,75l", preis: 14.00 },
            ],
            speisen: [
                { name: "Wurstsalat", preis: 7.50 },
                { name: "Pizza Margherita", preis: 7.00 },
                { name: "Flammkuchen", preis: 7.00 },
                { name: "Sonstige Pizza", preis: 7.50 },
            ],
            sonstiges: [
                { name: "10 Cent", preis: 0.10 },
                { name: "20 Cent", preis: 0.20 },
                { name: "30 Cent", preis: 0.30 },
                { name: "40 Cent", preis: 0.40 },
                { name: "50 Cent", preis: 0.50 },
                { name: "1 Euro", preis: 1.00 },
                { name: "2 Euro", preis: 2.00 },
                { name: "3 Euro", preis: 3.00 },
                { name: "4 Euro", preis: 4.00 },
                { name: "5 Euro", preis: 5.00 },
               
            ]
        };
        // ============================================

        let warenkorb = [];

        function formatPreis(preis) {
            return preis.toFixed(2).replace('.', ',') + ' €';
        }

        function renderProdukte() {
            for (const [kategorie, items] of Object.entries(produkte)) {
                const container = document.getElementById(kategorie);
                container.innerHTML = items.map((item, idx) => `
                    <button class="item-btn" onclick="hinzufuegen('${kategorie}', ${idx})">
                        <span class="item-name">${item.name}</span>
                        <span class="item-price">${formatPreis(item.preis)}</span>
                    </button>
                `).join('');
            }
        }

        function hinzufuegen(kategorie, idx) {
            const produkt = produkte[kategorie][idx];
            const existing = warenkorb.find(w => w.name === produkt.name);
            
            if (existing) {
                existing.menge++;
            } else {
                warenkorb.push({ ...produkt, menge: 1 });
            }
            
            renderWarenkorb();
        }

        function entfernen(index) {
            if (warenkorb[index].menge > 1) {
                warenkorb[index].menge--;
            } else {
                warenkorb.splice(index, 1);
            }
            renderWarenkorb();
        }

        function renderWarenkorb() {
            const liste = document.getElementById('liste');
            const summeEl = document.getElementById('summe');
            
            if (warenkorb.length === 0) {
                liste.innerHTML = '<p class="empty-msg">Noch keine Artikel ausgewählt</p>';
                summeEl.textContent = '0,00 €';
                return;
            }
            
			liste.innerHTML = warenkorb.map((item, idx) => `
				<div class="warenkorb-item">
					
					<div class="warenkorb-menge">
						<span class="menge">${item.menge}x</span>
					</div>

					<div class="warenkorb-name">
						${item.name}
					</div>

					<div class="warenkorb-rechts">
						<span>${formatPreis(item.preis * item.menge)}</span>
						<button class="remove-btn" onclick="entfernen(${idx})">-</button>
					</div>

				</div>
			`).join('');
            
            const summe = warenkorb.reduce((sum, item) => sum + (item.preis * item.menge), 0);
            summeEl.textContent = formatPreis(summe);
        }

        function leeren() {
            warenkorb = [];
            renderWarenkorb();
        }

        function bezahlen() {
            if (warenkorb.length === 0) return;
            
            const summe = warenkorb.reduce((sum, item) => sum + (item.preis * item.menge), 0);
            alert(`Bezahlt: ${formatPreis(summe)}\n\nVielen Dank!`);
            leeren();
        }

        // Start
        renderProdukte();
    </script>
</body>
</html>
